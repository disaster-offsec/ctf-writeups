[unix_http_server]
file=/data/supervisor.sock
chmod=0770
chown=app:app

[supervisord]
nodaemon=true
user=root
logfile=/data/supervisord.log
pidfile=/data/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///data/supervisor.sock

[program:web]
command=gunicorn -w 2 -b 0.0.0.0:5000 app.web:app
user=app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/data/web.log
stderr_logfile=/data/web.err.log

[program:celery]
command=celery -A app.tasks worker -B --concurrency=2 -l info
user=app
directory=/data
autostart=true
autorestart=true
stdout_logfile=/data/worker.log
stderr_logfile=/data/worker.err.log
